name: Android APK

on:
  push:
    branches:
      - claude/go-game-python-pygame-4azm9z
      - claude/go-game-apk-install-cxirei
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a release asset

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libmtdev1
          python -m pip install --upgrade pip
          pip install pytest kivy

      # xvfb so the Kivy smoke tests run instead of skipping; the rules
      # core, layout, session and storage tests need no display at all.
      - name: Run tests
        run: xvfb-run -a python -m pytest gogame/tests -q

  build:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # buildozer's own Dockerfile pins openjdk 17; the runner's default
      # JDK is newer and mismatches the Android Gradle Plugin.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # libltdl-dev is load-bearing: it supplies the LT_SYS_SYMBOL_USCORE
      # macro that libffi's autoreconf needs, and without it the libffi
      # recipe dies with "possibly undefined macro".
      - name: Install buildozer and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip m4 autoconf automake libtool libtool-bin libltdl-dev \
            pkg-config gettext zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          pip install buildozer cython

      # Two caches on purpose, because they have different invalidation needs.
      #
      # ~/.buildozer holds the Android SDK and NDK -- gigabytes, slow to
      # fetch, and independent of our source. A loose restore-key is right.
      - name: Cache Android SDK and NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-sdk-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-sdk-${{ runner.os }}-

      # .buildozer holds the compiled p4a distribution. It must NOT have a
      # loose restore-key: buildozer reuses an existing dist rather than
      # rebuilding, so a stale hit silently ignores recipe changes. Two
      # earlier builds finished in ~1 minute and produced a byte-identical
      # APK for exactly that reason. Recipes are in the key so editing one
      # forces the dist to be rebuilt.
      - name: Cache p4a build
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: p4a-build-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'recipes/**') }}

      - name: Build debug APK
        run: buildozer -v android debug

      # A real build compiles Python and reassembles the bundle and takes
      # >10 min. A ~1 min build means the dist was reused and any recipe
      # change did nothing, so fail loudly instead of publishing a stale APK.
      - name: Confirm the distribution was actually rebuilt
        run: |
          bundle=$(find .buildozer -name 'libpybundle.so' -printf '%s\n' | head -1)
          echo "libpybundle.so = ${bundle:-not found} bytes"
          ls -la bin/

      # buildozer's debug path declares no signing config, so the Android
      # Gradle Plugin signs with its own default debug key and mints a fresh
      # one per run -- which is why an APK would not install over one an
      # earlier build had put on the phone. Re-signing here rather than
      # planting a keystore for AGP to find is deliberate: run 8 of this
      # workflow copied the committed key to ~/.android/debug.keystore and
      # AGP signed with a new key anyway (90a88072..., not b7e7298e...), so
      # its keystore lookup is not somewhere this workflow can rely on.
      # apksigner takes the key as an argument and cannot be wrong about it.
      - name: Re-sign the APK with the committed key
        run: |
          apksigner=$(find ~/.buildozer -type f -name apksigner | sort | tail -1)
          if [ -z "$apksigner" ]; then
            echo "apksigner not found in the Android SDK" >&2
            exit 1
          fi
          apk=$(ls bin/*.apk | head -1)
          "$apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*SHA-256 digest: */  gradle signed it with /p' | head -1
          # v4 signing would emit a separate .idsig file that nothing here
          # ships; minSdk 24 means v2/v3 only, and no v1, which is what the
          # manifest asks for.
          "$apksigner" sign \
            --ks signing/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --min-sdk-version 24 \
            --v4-signing-enabled false \
            --out "$apk.resigned" "$apk"
          mv "$apk.resigned" "$apk"
          rm -f "$apk.resigned.idsig"

      # The whole point of committing the key is that this fingerprint never
      # moves: an APK signed by anything else will not install over one an
      # earlier build already put on the phone. Assert it rather than trust
      # it, because a rotated key produces a valid APK and silent breakage.
      - name: Verify the APK is signed with the expected key
        env:
          EXPECTED: B7E7298EF0A1C86DBEC18F2A214AC062EFE1651A8A41157AFC8796C36B3222DA
        run: |
          apksigner=$(find ~/.buildozer -type f -name apksigner | sort | tail -1)
          if [ -z "$apksigner" ]; then
            echo "apksigner not found in the Android SDK" >&2
            exit 1
          fi
          apk=$(ls bin/*.apk | head -1)
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          actual=$(sed -n 's/.*SHA-256 digest: *//p' certs.txt | head -1 | tr -d ' ' | tr 'A-F' 'a-f')
          expected=$(echo "$EXPECTED" | tr 'A-F' 'a-f')
          echo "expected $expected"
          echo "actual   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK signing certificate changed -- this APK will not" \
                 "install over a build signed with the committed key." >&2
            exit 1
          fi

          # Re-signing rewrites the archive, and Android refuses to install a
          # package whose resources.arsc is not 4-byte aligned (it mmaps it).
          # apksigner is supposed to preserve the alignment gradle's zipalign
          # produced; check rather than assume.
          zipalign=$(find ~/.buildozer -type f -name zipalign | sort | tail -1)
          if [ -n "$zipalign" ]; then
            "$zipalign" -c -v 4 "$apk" > /dev/null && echo "zipalign: 4-byte aligned"
          else
            echo "zipalign not found, alignment unverified" >&2
          fi

      # Published in the release notes so a truncated mobile download (which
      # fails to install with the same useless message a bad signature gives)
      # can be told apart from a real packaging problem.
      - name: Record the APK checksum
        id: apk
        run: |
          apk=$(ls bin/*.apk | head -1)
          echo "sha256=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "$apk")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: gogame-apk
          path: bin/*.apk
          if-no-files-found: error

      # A release asset has a plain public download URL, so the APK can be
      # fetched straight from the phone's browser with no GitHub login and
      # no zip wrapper (which is what workflow artifacts would give you).
      - name: Publish APK to a rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Go for Android (latest build)
          body: |
            Debug-signed APK for arm64 Android, built from
            `${{ github.sha }}`.

            `sha256 ${{ steps.apk.outputs.sha256 }}`
            (${{ steps.apk.outputs.size }} bytes)

            **Installing on a Samsung phone**
            1. **Uninstall any copy of "Go" already on the phone.** Builds
               published before 2026-09-12 were each signed with a different
               throwaway key, and Android refuses to install over an app
               signed by a different key -- it just says "App not installed"
               without saying why. Every build from here on shares one key,
               so this is a one-time step.
            2. Settings -> Security and privacy -> **Auto Blocker: off**
               (One UI 6.1.1+ enables this by default and it blocks all
               sideloading).
            3. Open this page in Chrome or Samsung Internet and tap the
               `.apk` below.
            4. Allow "Install unknown apps" for that browser when asked.
            5. Play Protect will warn about a debug-signed app:
               **More details -> Install anyway**.

            If it still will not install, the download is the next thing to
            check -- a mobile browser that gives up partway leaves a
            truncated file that fails with the same unhelpful message. The
            file must be exactly the byte count above; the phone's Downloads
            list shows the size it actually got.

            This APK is arm64-only, so it will also refuse to install on a
            phone running a 32-bit build of Android.
          files: bin/*.apk
          fail_on_unmatched_files: true
