name: Android APK

on:
  push:
    branches:
      - claude/go-game-python-pygame-4azm9z
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK as a release asset

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libmtdev1
          python -m pip install --upgrade pip
          pip install pytest kivy

      # xvfb so the Kivy smoke tests run instead of skipping; the rules
      # core, layout, session and storage tests need no display at all.
      - name: Run tests
        run: xvfb-run -a python -m pytest gogame/tests -q

  build:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # buildozer's own Dockerfile pins openjdk 17; the runner's default
      # JDK is newer and mismatches the Android Gradle Plugin.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # libltdl-dev is load-bearing: it supplies the LT_SYS_SYMBOL_USCORE
      # macro that libffi's autoreconf needs, and without it the libffi
      # recipe dies with "possibly undefined macro".
      - name: Install buildozer and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip m4 autoconf automake libtool libtool-bin libltdl-dev \
            pkg-config gettext zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          pip install buildozer cython

      # Two caches on purpose, because they have different invalidation needs.
      #
      # ~/.buildozer holds the Android SDK and NDK -- gigabytes, slow to
      # fetch, and independent of our source. A loose restore-key is right.
      - name: Cache Android SDK and NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-sdk-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-sdk-${{ runner.os }}-

      # .buildozer holds the compiled p4a distribution. It must NOT have a
      # loose restore-key: buildozer reuses an existing dist rather than
      # rebuilding, so a stale hit silently ignores recipe changes. Two
      # earlier builds finished in ~1 minute and produced a byte-identical
      # APK for exactly that reason. Recipes are in the key so editing one
      # forces the dist to be rebuilt.
      - name: Cache p4a build
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: p4a-build-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'recipes/**') }}

      - name: Build debug APK
        run: buildozer -v android debug

      # A real build compiles Python and reassembles the bundle and takes
      # >10 min. A ~1 min build means the dist was reused and any recipe
      # change did nothing, so fail loudly instead of publishing a stale APK.
      - name: Confirm the distribution was actually rebuilt
        run: |
          bundle=$(find .buildozer -name 'libpybundle.so' -printf '%s\n' | head -1)
          echo "libpybundle.so = ${bundle:-not found} bytes"
          ls -la bin/


      - uses: actions/upload-artifact@v4
        with:
          name: gogame-apk
          path: bin/*.apk
          if-no-files-found: error

      # A release asset has a plain public download URL, so the APK can be
      # fetched straight from the phone's browser with no GitHub login and
      # no zip wrapper (which is what workflow artifacts would give you).
      - name: Publish APK to a rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Go for Android (latest build)
          body: |
            Debug-signed APK for arm64 Android, built from
            `${{ github.sha }}`.

            **Installing on a Samsung phone**
            1. Settings -> Security and privacy -> **Auto Blocker: off**
               (One UI 6.1.1+ enables this by default and it blocks all
               sideloading).
            2. Open this page in Chrome or Samsung Internet and tap the
               `.apk` below.
            3. Allow "Install unknown apps" for that browser when asked.
            4. Play Protect will warn about a debug-signed app:
               **More details -> Install anyway**.
          files: bin/*.apk
          fail_on_unmatched_files: true
